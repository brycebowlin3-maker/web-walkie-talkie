<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Web Walkie Camera</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#080b10;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
  padding:20px;
}
.app{
  width:100%;
  max-width:650px;
  margin:auto;
}
h1{
  text-align:center;
  margin:10px 0 5px;
  font-size:30px;
}
.subtitle{
  text-align:center;
  color:#8993a0;
  margin-bottom:25px;
}
input{
  width:100%;
  height:55px;
  border-radius:14px;
  border:1px solid #303946;
  background:#111720;
  color:white;
  font-size:20px;
  text-align:center;
  text-transform:uppercase;
  outline:none;
}
button{
  width:100%;
  height:55px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:#5865f2;
  color:white;
  font-size:16px;
  font-weight:900;
}
button:disabled{
  opacity:.4;
}
.stop{
  background:#e33d52;
}
.gray{
  background:#29333f;
}
.flip{
  background:#59636f;
}
.security{
  background:#111;
  border:1px solid #303030;
}
.status{
  margin:15px 0;
  padding:13px;
  border-radius:12px;
  background:#141a22;
  text-align:center;
  font-weight:900;
}
.label{
  margin-top:18px;
  margin-bottom:7px;
  color:#7f8996;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}
.room{
  text-align:center;
  font-size:28px;
  font-weight:1000;
  letter-spacing:5px;
}
video{
  display:block;
  width:100%;
  margin-top:10px;
  background:#000;
  border-radius:17px;
}
#remoteVideo{
  min-height:220px;
  max-height:600px;
  object-fit:contain;
}
#localVideo{
  max-height:350px;
  object-fit:cover;
}
.hidden{
  display:none!important;
}
#debug{
  margin-top:15px;
  height:120px;
  overflow-y:auto;
  padding:10px;
  border-radius:10px;
  background:#05070a;
  color:#8d98a6;
  font:11px monospace;
}
/* =========================================================
   SECURITY MODE
========================================================= */
#securityScreen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:999999;
  display:none;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
}
#securityScreen.active{
  display:flex;
}
.securityMessage{
  color:#080808;
  user-select:none;
}
.securityControls{
  position:absolute;
  left:20px;
  right:20px;
  bottom:25px;
  opacity:0;
  transform:translateY(20px);
  transition:.2s;
}
.securityScreenVisible .securityControls{
  opacity:1;
  transform:translateY(0);
}
.securityControls button{
  max-width:650px;
  margin-left:auto;
  margin-right:auto;
  display:block;
}
.liveDot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff334f;
  margin-right:6px;
}
.securityTop{
  position:absolute;
  top:20px;
  left:20px;
  color:#333;
  font-size:12px;
  font-weight:900;
}
</style>
</head>
<body>
<div class="app">
<h1>📻 Web Walkie</h1>
<div class="subtitle">
Live Camera • WebRTC
</div>
<!-- =====================================================
     JOIN
====================================================== -->
<div id="joinScreen">
  <div class="label">
    Room Code
  </div>
  <input
    id="roomInput"
    maxlength="12"
    placeholder="CAM777"
    autocomplete="off"
    autocapitalize="characters"
  >
  <button id="joinButton">
    JOIN ROOM
  </button>
</div>
<!-- =====================================================
     ROOM
====================================================== -->
<div id="roomScreen" class="hidden">
  <div id="status" class="status">
    Connecting...
  </div>
  <div class="label">
    Room
  </div>
  <div id="roomDisplay" class="room"></div>
  <!-- REMOTE -->
  <div class="label">
    <span class="liveDot"></span>
    Remote Live Camera
  </div>
  <video
    id="remoteVideo"
    autoplay
    playsinline
    webkit-playsinline>
  </video>
  <!-- LOCAL -->
  <div class="label">
    Your Camera
  </div>
  <video
    id="localVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline>
  </video>
  <button
    id="cameraButton">
    📹 START CAMERA
  </button>
  <button
    id="flipButton"
    class="flip"
    disabled>
    🔄 FLIP CAMERA
  </button>
  <button
    id="securityButton"
    class="security"
    disabled>
    ⚫ SECURITY MODE
  </button>
  <button
    id="stopButton"
    class="stop"
    disabled>
    🛑 STOP CAMERA
  </button>
  <button
    id="leaveButton"
    class="gray">
    LEAVE ROOM
  </button>
  <div id="debug"></div>
</div>
</div>
<!-- =====================================================
     SECURITY SCREEN
====================================================== -->
<div id="securityScreen">
  <div class="securityMessage">
    .
  </div>
  <div class="securityTop">
    LIVE
  </div>
  <div class="securityControls">
    <button
      id="securityFlipButton"
      class="flip">
      🔄 FLIP CAMERA
    </button>
    <button
      id="exitSecurityButton"
      class="gray">
      EXIT SECURITY MODE
    </button>
  </div>
</div>
<!-- =====================================================
     FIREBASE
====================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* =========================================================
   FIREBASE
========================================================= */
const firebaseConfig = {
  apiKey:
  "AIzaSyAwziMLKnyFi8of5AbS3NXOmVQwo1Ngn5M",
  authDomain:
  "web-walkie-talkie-eb91f.firebaseapp.com",
  databaseURL:
  "https://web-walkie-talkie-eb91f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:
  "web-walkie-talkie-eb91f",
  storageBucket:
  "web-walkie-talkie-eb91f.firebasestorage.app",
  messagingSenderId:
  "174542114980",
  appId:
  "1:174542114980:web:f4a48ec7fe322030bdd631"
};
firebase.initializeApp(firebaseConfig);
const auth =
firebase.auth();
const database =
firebase.database();
/* =========================================================
   WEBRTC
========================================================= */
const rtcConfig = {
  iceServers:[
    {
      urls:
      "stun:stun.l.google.com:19302"
    },
    {
      urls:
      "stun:stun1.l.google.com:19302"
    }
  ]
};
/* =========================================================
   STATE
========================================================= */
let uid = null;
let roomCode = null;
let roomRef = null;
let peer = null;
let localStream = null;
let isHost = false;
let usingFrontCamera = true;
/* =========================================================
   ELEMENTS
========================================================= */
const joinScreen =
document.getElementById("joinScreen");
const roomScreen =
document.getElementById("roomScreen");
const roomInput =
document.getElementById("roomInput");
const joinButton =
document.getElementById("joinButton");
const status =
document.getElementById("status");
const roomDisplay =
document.getElementById("roomDisplay");
const localVideo =
document.getElementById("localVideo");
const remoteVideo =
document.getElementById("remoteVideo");
const cameraButton =
document.getElementById("cameraButton");
const flipButton =
document.getElementById("flipButton");
const securityButton =
document.getElementById("securityButton");
const stopButton =
document.getElementById("stopButton");
const leaveButton =
document.getElementById("leaveButton");
const debug =
document.getElementById("debug");
const securityScreen =
document.getElementById("securityScreen");
const securityFlipButton =
document.getElementById("securityFlipButton");
const exitSecurityButton =
document.getElementById("exitSecurityButton");
/* =========================================================
   DEBUG
========================================================= */
function log(message){
  console.log(message);
  const line =
  document.createElement("div");
  line.textContent =
  new Date().toLocaleTimeString()+
  " | "+
  message;
  debug.appendChild(line);
  debug.scrollTop =
  debug.scrollHeight;
}
/* =========================================================
   LOGIN
========================================================= */
async function login(){
  if(auth.currentUser){
    uid =
    auth.currentUser.uid;
    return;
  }
  const result =
  await auth.signInAnonymously();
  uid =
  result.user.uid;
  log(
    "Firebase login OK"
  );
}
/* =========================================================
   CREATE PEER
========================================================= */
function createPeer(){
  if(peer){
    return peer;
  }
  peer =
  new RTCPeerConnection(
    rtcConfig
  );
  /*
   * RECEIVE REMOTE CAMERA
   */
  peer.ontrack =
  function(event){
    log(
      "REMOTE TRACK: "+
      event.track.kind
    );
    if(
      event.track.kind === "video"
    ){
      const stream =
      event.streams[0];
      if(stream){
        remoteVideo.srcObject =
        stream;
        remoteVideo.play()
        .then(()=>{
          log(
            "REMOTE VIDEO PLAYING"
          );
        })
        .catch(error=>{
          log(
            "REMOTE PLAY ERROR: "+
            error.message
          );
        });
      }
    }
  };
  /*
   * ICE
   */
  peer.onicecandidate =
  function(event){
    if(!event.candidate){
      return;
    }
    const candidate =
    event.candidate.toJSON();
    if(isHost){
      roomRef
      .child("hostIce")
      .push(candidate);
    }
    else{
      roomRef
      .child("viewerIce")
      .push(candidate);
    }
  };
  /*
   * CONNECTION
   */
  peer.onconnectionstatechange =
  function(){
    log(
      "CONNECTION: "+
      peer.connectionState
    );
    if(
      peer.connectionState ===
      "connected"
    ){
      status.textContent =
      "🟢 LIVE";
    }
    if(
      peer.connectionState ===
      "connecting"
    ){
      status.textContent =
      "🟡 CONNECTING...";
    }
    if(
      peer.connectionState ===
      "failed"
    ){
      status.textContent =
      "🔴 CONNECTION FAILED";
    }
  };
  return peer;
}
/* =========================================================
   START CAMERA
========================================================= */
async function startCamera(){
  log(
    "REQUESTING CAMERA..."
  );
  localStream =
  await navigator.mediaDevices
  .getUserMedia({
    video:{
      facingMode:
      usingFrontCamera
      ? "user"
      : "environment",
      width:{
        ideal:1280
      },
      height:{
        ideal:720
      },
      frameRate:{
        ideal:30
      }
    },
    audio:false
  });
  log(
    "CAMERA PERMISSION GRANTED"
  );
  localVideo.srcObject =
  localStream;
  await localVideo.play();
  log(
    "LOCAL CAMERA PLAYING"
  );
}
/* =========================================================
   SETUP HOST
========================================================= */
async function setupHost(){
  isHost=true;
  /*
   * CAMERA FIRST
   */
  await startCamera();
  /*
   * THEN WEBRTC
   */
  createPeer();
  /*
   * ADD CAMERA TRACK
   */
  const track =
  localStream
  .getVideoTracks()[0];
  peer.addTrack(
    track,
    localStream
  );
  log(
    "CAMERA TRACK ADDED"
  );
  /*
   * CREATE OFFER
   */
  const offer =
  await peer.createOffer();
  await peer.setLocalDescription(
    offer
  );
  /*
   * SEND OFFER
   */
  await roomRef
  .child("offer")
  .set({
    type:
    offer.type,
    sdp:
    offer.sdp
  });
  log(
    "CAMERA OFFER SENT"
  );
  status.textContent =
  "🟡 CAMERA LIVE — WAITING FOR VIEWER";
  /*
   * ANSWER
   */
  roomRef
  .child("answer")
  .on(
    "value",
    async snapshot=>{
      const answer =
      snapshot.val();
      if(!answer){
        return;
      }
      if(
        peer.signalingState !==
        "have-local-offer"
      ){
        return;
      }
      log(
        "ANSWER RECEIVED"
      );
      await peer.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );
      log(
        "REMOTE DESCRIPTION SET"
      );
    }
  );
  /*
   * VIEWER ICE
   */
  roomRef
  .child("viewerIce")
  .on(
    "child_added",
    async snapshot=>{
      try{
        await peer.addIceCandidate(
          new RTCIceCandidate(
            snapshot.val()
          )
        );
        log(
          "VIEWER ICE ADDED"
        );
      }
      catch(error){
        log(
          "VIEWER ICE ERROR: "+
          error.message
        );
      }
    }
  );
  cameraButton.textContent =
  "🟢 CAMERA LIVE";
  flipButton.disabled =
  false;
  securityButton.disabled =
  false;
  stopButton.disabled =
  false;
}
/* =========================================================
   SETUP VIEWER
========================================================= */
async function setupViewer(){
  isHost=false;
  createPeer();
  status.textContent =
  "🟡 WAITING FOR CAMERA...";
  /*
   * OFFER
   */
  roomRef
  .child("offer")
  .on(
    "value",
    async snapshot=>{
      const offer =
      snapshot.val();
      if(!offer){
        return;
      }
      if(
        peer.signalingState !==
        "stable"
      ){
        return;
      }
      log(
        "CAMERA OFFER RECEIVED"
      );
      await peer.setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );
      log(
        "REMOTE DESCRIPTION SET"
      );
      const answer =
      await peer.createAnswer();
      await peer.setLocalDescription(
        answer
      );
      await roomRef
      .child("answer")
      .set({
        type:
        answer.type,
        sdp:
        answer.sdp
      });
      log(
        "ANSWER SENT"
      );
    }
  );
  /*
   * HOST ICE
   */
  roomRef
  .child("hostIce")
  .on(
    "child_added",
    async snapshot=>{
      try{
        await peer.addIceCandidate(
          new RTCIceCandidate(
            snapshot.val()
          )
        );
        log(
          "HOST ICE ADDED"
        );
      }
      catch(error){
        log(
          "HOST ICE ERROR: "+
          error.message
        );
      }
    }
  );
}
/* =========================================================
   FLIP CAMERA
========================================================= */
async function flipCamera(){
  if(!localStream){
    return;
  }
  log(
    "FLIPPING CAMERA..."
  );
  usingFrontCamera =
  !usingFrontCamera;
  const newStream =
  await navigator.mediaDevices
  .getUserMedia({
    video:{
      facingMode:
      usingFrontCamera
      ? "user"
      : "environment",
      width:{
        ideal:1280
      },
      height:{
        ideal:720
      },
      frameRate:{
        ideal:30
      }
    },
    audio:false
  });
  const newTrack =
  newStream
  .getVideoTracks()[0];
  /*
   * FIND EXISTING VIDEO SENDER
   */
  const sender =
  peer
  .getSenders()
  .find(
    s =>
    s.track &&
    s.track.kind === "video"
  );
  if(!sender){
    throw new Error(
      "WebRTC video sender not found."
    );
  }
  /*
   * REPLACE TRACK
   */
  await sender.replaceTrack(
    newTrack
  );
  /*
   * STOP OLD CAMERA
   */
  localStream
  .getTracks()
  .forEach(
    track=>{
      if(
        track.kind === "video"
      ){
        track.stop();
      }
    }
  );
  localStream =
  newStream;
  localVideo.srcObject =
  newStream;
  await localVideo.play();
  log(
    usingFrontCamera
    ? "FRONT CAMERA"
    : "BACK CAMERA"
  );
}
/* =========================================================
   SECURITY MODE
========================================================= */
function enterSecurityMode(){
  securityScreen.classList.add(
    "active"
  );
  document.body.style.padding =
  "0";
  log(
    "SECURITY MODE ON"
  );
}
/* =========================================================
   SHOW SECURITY CONTROLS
========================================================= */
let hideControlsTimer = null;
securityScreen.addEventListener(
  "click",
  function(){
    securityScreen.classList.toggle(
      "securityScreenVisible"
    );
    clearTimeout(
      hideControlsTimer
    );
    if(
      securityScreen.classList.contains(
        "securityScreenVisible"
      )
    ){
      hideControlsTimer =
      setTimeout(
        ()=>{
          securityScreen.classList.remove(
            "securityScreenVisible"
          );
        },
        3000
      );
    }
  }
);
/* =========================================================
   EXIT SECURITY
========================================================= */
function exitSecurityMode(){
  securityScreen.classList.remove(
    "active"
  );
  securityScreen.classList.remove(
    "securityScreenVisible"
  );
  document.body.style.padding =
  "20px";
  log(
    "SECURITY MODE OFF"
  );
}
/* =========================================================
   JOIN
========================================================= */
joinButton.onclick =
async function(){
  const entered =
  roomInput.value
  .trim()
  .toUpperCase()
  .replace(
    /[^A-Z0-9]/g,
    ""
  );
  if(!entered){
    alert(
      "Enter a room code."
    );
    return;
  }
  joinButton.disabled =
  true;
  try{
    await login();
    roomCode =
    entered;
    roomDisplay.textContent =
    roomCode;
    roomRef =
    database.ref(
      "liveCameraRooms/" +
      roomCode
    );
    const snapshot =
    await roomRef.once(
      "value"
    );
    /*
     * FIRST DEVICE
     * = CAMERA
     */
    if(!snapshot.exists()){
      await roomRef.set({
        host:
        uid,
        createdAt:
        firebase.database.ServerValue.TIMESTAMP
      });
      isHost=true;
      log(
        "ROOM CREATED"
      );
    }
    else{
      /*
       * SECOND DEVICE
       * = VIEWER
       */
      isHost=false;
      log(
        "ROOM EXISTS"
      );
    }
    joinScreen.classList.add(
      "hidden"
    );
    roomScreen.classList.remove(
      "hidden"
    );
    if(isHost){
      cameraButton.disabled =
      false;
      status.textContent =
      "📹 TAP START CAMERA";
    }
    else{
      cameraButton.disabled =
      true;
      flipButton.disabled =
      true;
      securityButton.disabled =
      true;
      stopButton.disabled =
      true;
      await setupViewer();
    }
  }
  catch(error){
    console.error(error);
    log(
      "JOIN ERROR: "+
      error.message
    );
    alert(
      "Could not join:\n\n"+
      error.message
    );
    joinButton.disabled =
    false;
  }
};
/* =========================================================
   CAMERA BUTTON
========================================================= */
cameraButton.onclick =
async function(){
  try{
    cameraButton.disabled =
    true;
    await setupHost();
  }
  catch(error){
    cameraButton.disabled =
    false;
    log(
      "CAMERA ERROR: "+
      error.name+
      " / "+
      error.message
    );
    alert(
      "Could not start camera:\n\n"+
      error.name+
      "\n"+
      error.message
    );
  }
};
/* =========================================================
   FLIP
========================================================= */
flipButton.onclick =
async function(){
  try{
    await flipCamera();
  }
  catch(error){
    console.error(error);
    log(
      "FLIP ERROR: "+
      error.message
    );
    alert(
      "Could not flip camera:\n\n"+
      error.message
    );
  }
};
securityFlipButton.onclick =
async function(event){
  event.stopPropagation();
  try{
    await flipCamera();
  }
  catch(error){
    console.error(error);
  }
};
/* =========================================================
   SECURITY
========================================================= */
securityButton.onclick =
function(){
  enterSecurityMode();
};
/* =========================================================
   EXIT SECURITY
========================================================= */
exitSecurityButton.onclick =
function(event){
  event.stopPropagation();
  exitSecurityMode();
};
/* =========================================================
   STOP
========================================================= */
stopButton.onclick =
function(){
  if(localStream){
    localStream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );
  }
  localStream =
  null;
  localVideo.srcObject =
  null;
  cameraButton.disabled =
  false;
  flipButton.disabled =
  true;
  securityButton.disabled =
  true;
  stopButton.disabled =
  true;
  status.textContent =
  "Camera stopped";
  log(
    "CAMERA STOPPED"
  );
};
/* =========================================================
   LEAVE
========================================================= */
leaveButton.onclick =
function(){
  if(localStream){
    localStream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );
  }
  if(peer){
    peer.close();
  }
  location.reload();
};
</script>
</body>
</html>
