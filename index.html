<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Web Walkie Talkie</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#070a0f;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding:
    max(12px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(12px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));
}

.app{
  width:100%;
  max-width:520px;
  min-height:calc(100vh - 24px);
  margin:auto;
  background:#111820;
  border:1px solid #293541;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

header{
  text-align:center;
  padding:24px;
  background:#171f29;
  border-bottom:1px solid #293541;
}

.logo{
  font-size:46px;
}

h1{
  margin:4px 0 0;
  font-size:28px;
}

.subtitle{
  margin-top:4px;
  color:#8793a1;
  font-size:13px;
}

main{
  padding:20px;
}

.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:13px;
  border-radius:15px;
  background:#090e14;
  border:1px solid #293541;
  font-weight:900;
  margin-bottom:20px;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#697482;
}

.dot.yellow{
  background:#ffd43b;
  box-shadow:0 0 14px #ffd43b;
}

.dot.green{
  background:#2ee875;
  box-shadow:0 0 14px #2ee875;
}

.dot.red{
  background:#ff4757;
  box-shadow:0 0 14px #ff4757;
}

.label{
  margin-bottom:8px;
  color:#7f8b99;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

input[type=text]{
  width:100%;
  height:55px;
  padding:0 16px;
  border:1px solid #34404d;
  border-radius:14px;
  outline:none;
  background:#090e14;
  color:white;
  font-size:18px;
  font-weight:900;
  text-transform:uppercase;
}

input[type=text]:focus{
  border-color:#5865f2;
}

button{
  width:100%;
  min-height:54px;
  margin-top:10px;
  border:0;
  border-radius:15px;
  background:#293542;
  color:white;
  font-size:15px;
  font-weight:900;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.45;
}

.primary{
  background:#5865f2;
}

.danger{
  background:#d9364f;
}

.hidden{
  display:none!important;
}

.help{
  margin-top:10px;
  color:#788493;
  font-size:12px;
  line-height:1.5;
}

.live{
  padding:12px;
  border-radius:14px;
  background:rgba(46,232,117,.08);
  border:1px solid rgba(46,232,117,.22);
  color:#79f4a5;
  text-align:center;
  font-weight:900;
}

.roomLabel{
  margin-top:18px;
  color:#788493;
  text-align:center;
  font-size:11px;
}

.roomCode{
  margin-top:3px;
  text-align:center;
  font-size:29px;
  font-weight:1000;
  letter-spacing:4px;
}

.radio{
  width:250px;
  height:250px;
  margin:22px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border:10px solid #2e3946;
  border-radius:50%;
  background:#1b242e;
  box-shadow:
    inset 0 0 35px rgba(0,0,0,.8),
    0 20px 50px rgba(0,0,0,.4);
}

.talk{
  width:155px;
  height:155px;
  margin:0;
  border:8px solid #3c4657;
  border-radius:50%;
  background:#5865f2;
  box-shadow:0 8px 30px rgba(88,101,242,.4);
}

.talk.active{
  background:#e0314f;
  box-shadow:0 0 45px rgba(224,49,79,.75);
}

.talkIcon{
  display:block;
  font-size:34px;
}

.talkText{
  display:block;
  margin-top:4px;
  font-size:13px;
}

.wave{
  height:30px;
  color:#667384;
  text-align:center;
  font-size:24px;
  letter-spacing:7px;
}

.wave.active{
  animation:pulse .5s infinite alternate;
}

@keyframes pulse{
  from{opacity:.3}
  to{opacity:1}
}

.talkStatus{
  margin-bottom:18px;
  text-align:center;
  font-weight:900;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.controls button{
  margin:0;
}

.divider{
  height:1px;
  margin:22px 0;
  background:#293541;
}

input[type=range]{
  width:100%;
}

.log{
  max-height:140px;
  overflow:auto;
  padding:11px;
  border:1px solid #252f3a;
  border-radius:13px;
  background:#090e14;
  color:#8793a2;
  font:11px monospace;
}

.log div{
  margin-bottom:5px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">📻</div>
  <h1>WEB WALKIE</h1>
  <div class="subtitle">Live WebRTC voice</div>
</header>

<main>

<div class="status">
  <span id="dot" class="dot"></span>
  <span id="status">Not connected</span>
</div>


<!-- JOIN SCREEN -->

<section id="joinScreen">

  <div class="label">
    Room Code
  </div>

  <input
    id="roomInput"
    type="text"
    maxlength="20"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="BRYCE123">

  <button
    id="joinButton"
    class="primary">
    📻 JOIN ROOM
  </button>

  <button id="randomButton">
    🎲 RANDOM ROOM
  </button>

  <div class="help">
    The first device automatically creates the room.
    The second device enters the same code and connects.
  </div>

</section>


<!-- WALKIE SCREEN -->

<section
  id="walkieScreen"
  class="hidden">

  <div class="live">
    🟢 WEBRTC WALKIE
  </div>

  <div class="roomLabel">
    ROOM
  </div>

  <div
    id="roomDisplay"
    class="roomCode">
  </div>


  <div class="radio">

    <button
      id="talkButton"
      class="talk"
      disabled>

      <span class="talkIcon">
        🎙️
      </span>

      <span class="talkText">
        HOLD TO TALK
      </span>

    </button>

  </div>


  <div
    id="wave"
    class="wave">
    • • •
  </div>


  <div
    id="talkStatus"
    class="talkStatus">
    Waiting for connection...
  </div>


  <div class="controls">

    <button id="muteButton">
      🎙️ Mic On
    </button>

    <button
      id="leaveButton"
      class="danger">
      ❌ Leave
    </button>

  </div>


  <div class="divider"></div>

  <div class="label">
    Speaker Volume
  </div>

  <input
    id="volume"
    type="range"
    min="0"
    max="1"
    value="1"
    step=".01">


  <div class="divider"></div>

  <div class="label">
    Connection Log
  </div>

  <div
    id="log"
    class="log">
  </div>

</section>

</main>
</div>


<audio
  id="remoteAudio"
  autoplay
  playsinline
  webkit-playsinline>
</audio>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAwziMLKnyFi8of5AbS3NXOmVQwo1Ngn5M",

  authDomain:
    "web-walkie-talkie-eb91f.firebaseapp.com",

  databaseURL:
    "https://web-walkie-talkie-eb91f-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "web-walkie-talkie-eb91f",

  storageBucket:
    "web-walkie-talkie-eb91f.firebasestorage.app",

  messagingSenderId:
    "174542114980",

  appId:
    "1:174542114980:web:f4a48ec7fe322030bdd631"

};


firebase.initializeApp(firebaseConfig);

const database =
  firebase.database();

const auth =
  firebase.auth();


/* =========================================================
   WEBRTC CONFIG
========================================================= */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    },

    {
      urls:
        "stun:stun2.l.google.com:19302"
    }

  ]

};


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let roomCode = "";

let roomRef = null;

let peer = null;

let localStream = null;

let remoteStream = null;

let isCaller = false;

let isTalking = false;

let isMuted = false;


/* =========================================================
   ELEMENTS
========================================================= */

const joinScreen =
  document.getElementById(
    "joinScreen"
  );

const walkieScreen =
  document.getElementById(
    "walkieScreen"
  );

const roomInput =
  document.getElementById(
    "roomInput"
  );

const joinButton =
  document.getElementById(
    "joinButton"
  );

const randomButton =
  document.getElementById(
    "randomButton"
  );

const talkButton =
  document.getElementById(
    "talkButton"
  );

const muteButton =
  document.getElementById(
    "muteButton"
  );

const leaveButton =
  document.getElementById(
    "leaveButton"
  );

const statusText =
  document.getElementById(
    "status"
  );

const statusDot =
  document.getElementById(
    "dot"
  );

const roomDisplay =
  document.getElementById(
    "roomDisplay"
  );

const talkStatus =
  document.getElementById(
    "talkStatus"
  );

const wave =
  document.getElementById(
    "wave"
  );

const remoteAudio =
  document.getElementById(
    "remoteAudio"
  );

const volume =
  document.getElementById(
    "volume"
  );

const logBox =
  document.getElementById(
    "log"
  );


/* =========================================================
   LOG
========================================================= */

function log(message){

  const line =
    document.createElement(
      "div"
    );

  line.textContent =
    new Date().toLocaleTimeString() +
    " — " +
    message;

  logBox.appendChild(line);

  logBox.scrollTop =
    logBox.scrollHeight;
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text,type){

  statusText.textContent =
    text;

  statusDot.className =
    "dot";

  if(type){

    statusDot.classList.add(
      type
    );

  }
}


/* =========================================================
   FIREBASE AUTH
========================================================= */

async function authenticate(){

  if(
    auth.currentUser
  ){

    currentUser =
      auth.currentUser;

    return currentUser;

  }


  log(
    "🔐 Signing in..."
  );


  const result =
    await auth.signInAnonymously();


  currentUser =
    result.user;


  log(
    "🔐 Signed in."
  );


  return currentUser;

}


/* =========================================================
   MICROPHONE
========================================================= */

async function getMicrophone(){

  if(localStream){

    return localStream;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      "Safari microphone API is unavailable."
    );

  }


  log(
    "🎙️ Requesting microphone..."
  );


  localStream =
    await navigator.mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },

        video:false

      });


  localStream
    .getAudioTracks()
    .forEach(
      track => {

        track.enabled =
          false;

      }
    );


  log(
    "🎙️ Microphone ready."
  );


  return localStream;

}


/* =========================================================
   CREATE PEER
========================================================= */

async function createPeer(){

  peer =
    new RTCPeerConnection(
      rtcConfig
    );


  remoteStream =
    new MediaStream();


  peer.ontrack =
    event => {

      event.streams[0]
        .getTracks()
        .forEach(
          track => {

            remoteStream.addTrack(
              track
            );

          }
        );


      remoteAudio.srcObject =
        remoteStream;


      remoteAudio.volume =
        Number(
          volume.value
        );


      remoteAudio.play()
        .catch(
          () => {

            log(
              "Safari is waiting for audio playback."
            );

          }
        );


      log(
        "🔊 Remote audio connected."
      );

    };


  peer.onicecandidate =
    event => {

      if(
        !event.candidate ||
        !roomRef
      ){

        return;

      }


      const path =
        isCaller
          ? "callerCandidates"
          : "calleeCandidates";


      roomRef
        .child(path)
        .push(
          event.candidate.toJSON()
        );

    };


  peer.onconnectionstatechange =
    () => {

      if(!peer){

        return;

      }


      const state =
        peer.connectionState;


      log(
        "WebRTC: " +
        state
      );


      if(
        state === "connected"
      ){

        setStatus(
          "Connected",
          "green"
        );


        talkButton.disabled =
          false;


        talkStatus.textContent =
          "Ready";

      }


      else if(
        state === "connecting"
      ){

        setStatus(
          "Connecting...",
          "yellow"
        );

      }


      else if(
        state === "failed"
      ){

        setStatus(
          "Connection failed",
          "red"
        );


        talkButton.disabled =
          true;


        talkStatus.textContent =
          "Connection failed";

      }


      else if(
        state === "disconnected"
      ){

        setStatus(
          "Disconnected",
          "red"
        );

      }

    };


  localStream
    .getTracks()
    .forEach(
      track => {

        peer.addTrack(
          track,
          localStream
        );

      }
    );

}


/* =========================================================
   CREATE NEW ROOM
========================================================= */

async function createRoom(){

  isCaller =
    true;


  setStatus(
    "Creating room...",
    "yellow"
  );


  await createPeer();


  roomRef =
    database.ref(
      "walkieRooms/" +
      roomCode
    );


  await roomRef.set({

    createdAt:
      firebase.database.ServerValue.TIMESTAMP,

    state:
      "waiting",

    owner:
      currentUser.uid

  });


  roomRef
    .child("answer")
    .on(
      "value",
      async snapshot => {

        const answer =
          snapshot.val();


        if(
          !answer ||
          peer.currentRemoteDescription
        ){

          return;

        }


        try{

          await peer.setRemoteDescription(
            new RTCSessionDescription(
              answer
            )
          );


          log(
            "📡 Answer received."
          );

        }
        catch(error){

          log(
            "Answer error."
          );

        }

      }
    );


  roomRef
    .child("calleeCandidates")
    .on(
      "child_added",
      async snapshot => {

        try{

          await peer.addIceCandidate(
            new RTCIceCandidate(
              snapshot.val()
            )
          );

        }
        catch(error){

          log(
            "ICE candidate error."
          );

        }

      }
    );


  const offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  await roomRef
    .child("offer")
    .set({

      type:
        offer.type,

      sdp:
        offer.sdp

    });


  setStatus(
    "Waiting for another device...",
    "yellow"
  );


  talkStatus.textContent =
    "Waiting for another device...";


  log(
    "📻 Room created: " +
    roomCode
  );

}


/* =========================================================
   JOIN EXISTING ROOM
========================================================= */

async function joinExistingRoom(){

  isCaller =
    false;


  setStatus(
    "Joining room...",
    "yellow"
  );


  await createPeer();


  const offerSnapshot =
    await roomRef
      .child("offer")
      .once("value");


  const offer =
    offerSnapshot.val();


  if(!offer){

    throw new Error(
      "Room exists but is not ready."
    );

  }


  await peer.setRemoteDescription(
    new RTCSessionDescription(
      offer
    )
  );


  roomRef
    .child("callerCandidates")
    .on(
      "child_added",
      async snapshot => {

        try{

          await peer.addIceCandidate(
            new RTCIceCandidate(
              snapshot.val()
            )
          );

        }
        catch(error){

          log(
            "ICE candidate error."
          );

        }

      }
    );


  const answer =
    await peer.createAnswer();


  await peer.setLocalDescription(
    answer
  );


  await roomRef
    .child("answer")
    .set({

      type:
        answer.type,

      sdp:
        answer.sdp

    });


  await roomRef
    .child("state")
    .set(
      "connected"
    );


  log(
    "📡 Connected to room."
  );

}


/* =========================================================
   JOIN BUTTON
========================================================= */

joinButton.onclick =
  async function(){

    const code =
      roomInput.value
        .trim()
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          ""
        );


    if(!code){

      alert(
        "Enter a room code."
      );

      return;

    }


    joinButton.disabled =
      true;

    randomButton.disabled =
      true;


    roomCode =
      code;


    try{

      /*
       * Authentication first.
       */

      await authenticate();


      /*
       * Microphone request occurs
       * directly from this button action.
       */

      await getMicrophone();


      roomDisplay.textContent =
        roomCode;


      joinScreen.classList.add(
        "hidden"
      );

      walkieScreen.classList.remove(
        "hidden"
      );


      roomRef =
        database.ref(
          "walkieRooms/" +
          roomCode
        );


      const snapshot =
        await roomRef.once(
          "value"
        );


      if(snapshot.exists()){

        /*
         * Room already exists.
         */

        await joinExistingRoom();

      }
      else{

        /*
         * First device creates it.
         */

        await createRoom();

      }

    }
    catch(error){

      console.error(error);

      log(
        "❌ " +
        error.message
      );


      alert(
        "Could not join:\n\n" +
        error.message
      );


      cleanup();


      joinButton.disabled =
        false;

      randomButton.disabled =
        false;

    }

  };


/* =========================================================
   RANDOM ROOM
========================================================= */

randomButton.onclick =
  function(){

    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";


    for(
      let i=0;
      i<6;
      i++
    ){

      code +=
        chars[
          Math.floor(
            Math.random() *
            chars.length
          )
        ];

    }


    roomInput.value =
      code;

  };


/* =========================================================
   START TALKING
========================================================= */

function startTalking(event){

  event.preventDefault();


  if(
    !peer ||
    peer.connectionState !==
      "connected"
  ){

    return;

  }


  if(
    isMuted ||
    isTalking
  ){

    return;

  }


  isTalking =
    true;


  talkButton.classList.add(
    "active"
  );


  wave.classList.add(
    "active"
  );


  talkStatus.textContent =
    "🔴 TRANSMITTING";


  if(localStream){

    localStream
      .getAudioTracks()
      .forEach(
        track => {

          track.enabled =
            true;

        }
      );

  }

}


/* =========================================================
   STOP TALKING
========================================================= */

function stopTalking(event){

  if(event){

    event.preventDefault();

  }


  if(!isTalking){

    return;

  }


  isTalking =
    false;


  talkButton.classList.remove(
    "active"
  );


  wave.classList.remove(
    "active"
  );


  talkStatus.textContent =
    "Ready";


  if(localStream){

    localStream
      .getAudioTracks()
      .forEach(
        track => {

          track.enabled =
            false;

        }
      );

  }

}


/* =========================================================
   TALK BUTTON
========================================================= */

talkButton.addEventListener(
  "pointerdown",
  startTalking
);

talkButton.addEventListener(
  "pointerup",
  stopTalking
);

talkButton.addEventListener(
  "pointercancel",
  stopTalking
);

talkButton.addEventListener(
  "pointerleave",
  stopTalking
);


/* =========================================================
   MUTE
========================================================= */

muteButton.onclick =
  function(){

    isMuted =
      !isMuted;


    if(isMuted){

      muteButton.textContent =
        "🔇 Mic Muted";


      muteButton.classList.add(
        "danger"
      );


      isTalking =
        false;


      talkButton.classList.remove(
        "active"
      );


      wave.classList.remove(
        "active"
      );


      talkStatus.textContent =
        "Mic muted";


      if(localStream){

        localStream
          .getAudioTracks()
          .forEach(
            track => {

              track.enabled =
                false;

            }
          );

      }

    }
    else{

      muteButton.textContent =
        "🎙️ Mic On";


      muteButton.classList.remove(
        "danger"
      );


      talkStatus.textContent =
        "Ready";

    }

  };


/* =========================================================
   VOLUME
========================================================= */

volume.oninput =
  function(){

    remoteAudio.volume =
      Number(
        volume.value
      );

  };


/* =========================================================
   LEAVE
========================================================= */

leaveButton.onclick =
  function(){

    cleanup();

  };


/* =========================================================
   CLEANUP
========================================================= */

function cleanup(){

  isTalking =
    false;


  if(roomRef){

    roomRef.off();

    /*
     * Only remove our room when
     * we are the caller.
     */

    if(isCaller){

      roomRef.remove()
        .catch(
          () => {}
        );

    }

  }


  if(peer){

    peer.close();

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {

          track.stop();

        }
      );

  }


  peer =
    null;

  localStream =
    null;

  remoteStream =
    null;

  roomRef =
    null;

  roomCode =
    "";

  remoteAudio.srcObject =
    null;


  walkieScreen.classList.add(
    "hidden"
  );

  joinScreen.classList.remove(
    "hidden"
  );


  joinButton.disabled =
    false;

  randomButton.disabled =
    false;

  talkButton.disabled =
    true;


  setStatus(
    "Not connected"
  );


  talkStatus.textContent =
    "Waiting for connection...";


  logBox.innerHTML =
    "";

}


/* =========================================================
   SAFETY
========================================================= */

window.addEventListener(
  "blur",
  stopTalking
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(document.hidden){

      stopTalking();

    }

  }
);


/* =========================================================
   STARTUP
========================================================= */

log(
  "📻 Web Walkie loaded."
);

log(
  "🔒 HTTPS detected: " +
  (
    location.protocol === "https:"
      ? "YES"
      : "NO"
  )
);

</script>
