<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Web Walkie</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;
background:#06090d;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
padding:
max(10px,env(safe-area-inset-top))
max(10px,env(safe-area-inset-right))
max(10px,env(safe-area-inset-bottom))
max(10px,env(safe-area-inset-left));
}

button,
input{
font-family:inherit;
}

button{
border:0;
color:white;
touch-action:manipulation;
-webkit-user-select:none;
user-select:none;
cursor:pointer;
}

button:active{
transform:scale(.97);
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

.app{
width:100%;
max-width:560px;
min-height:calc(100vh - 20px);
margin:auto;
background:#10161d;
border:1px solid #27313b;
border-radius:30px;
overflow:hidden;
box-shadow:0 25px 80px rgba(0,0,0,.6);
}

header{
padding:24px 20px 20px;
text-align:center;
background:
linear-gradient(
180deg,
#18212b,
#121920
);
border-bottom:1px solid #27313b;
}

.logo{
font-size:48px;
line-height:1;
}

h1{
margin:7px 0 0;
font-size:28px;
font-weight:1000;
letter-spacing:-.5px;
}

.subtitle{
margin-top:4px;
color:#7f8b99;
font-size:13px;
}

main{
padding:18px;
}

.status{
height:48px;
display:flex;
align-items:center;
justify-content:center;
gap:9px;
background:#080d12;
border:1px solid #29343f;
border-radius:15px;
font-size:14px;
font-weight:900;
margin-bottom:17px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#687481;
}

.dot.yellow{
background:#ffd43b;
box-shadow:0 0 14px #ffd43b;
}

.dot.green{
background:#2ee875;
box-shadow:0 0 14px #2ee875;
}

.dot.red{
background:#ff4757;
box-shadow:0 0 14px #ff4757;
}

.label{
font-size:10px;
font-weight:1000;
letter-spacing:1.2px;
text-transform:uppercase;
color:#7d8996;
margin-bottom:8px;
}

input[type=text]{
width:100%;
height:56px;
padding:0 16px;
background:#080d12;
border:1px solid #34414d;
border-radius:15px;
outline:none;
color:white;
font-size:18px;
font-weight:900;
text-transform:uppercase;
}

input[type=text]:focus{
border-color:#6572ff;
}

.primary{
background:#5865f2;
}

.secondary{
background:#293540;
}

.danger{
background:#d9364f;
}

.green{
background:#199d57;
}

.joinButton{

height:56px;
margin-top:10px;
border-radius:15px;
font-size:15px;
font-weight:1000;
}

.help{
margin-top:11px;
font-size:12px;
line-height:1.5;
color:#778391;
text-align:center;
}

.hidden{
display:none!important;
}

.live{
padding:11px;
border-radius:14px;
background:rgba(46,232,117,.07);
border:1px solid rgba(46,232,117,.2);
text-align:center;
font-weight:1000;
color:#6ff2a0;
}

.roomInfo{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:15px;
}

.roomName{
flex:1;
}

.roomCode{
font-size:26px;
font-weight:1000;
letter-spacing:4px;
}

.copyButton{
width:85px;
height:42px;
border-radius:12px;
background:#293540;
font-size:12px;
font-weight:1000;
}

.radio{
width:255px;
height:255px;
margin:20px auto 16px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
border:10px solid #2d3945;
background:
radial-gradient(
circle,
#26313c 0%,
#19232d 50%,
#111820 100%
);
box-shadow:
inset 0 0 40px rgba(0,0,0,.75),
0 18px 50px rgba(0,0,0,.4);
}

.talk{
width:158px;
height:158px;
border-radius:50%;
border:8px solid #3d4856;
background:#5865f2;
box-shadow:0 10px 35px rgba(88,101,242,.4);
}

.talk.active{
background:#e0314f;
box-shadow:
0 0 20px #e0314f,
0 0 55px rgba(224,49,79,.65);
}

.talkIcon{
display:block;
font-size:35px;
}

.talkText{
display:block;
font-size:12px;
font-weight:1000;
margin-top:5px;
}

.talkStatus{
text-align:center;
font-weight:1000;
margin-bottom:14px;
}

.wave{
height:27px;
text-align:center;
font-size:23px;
letter-spacing:7px;
color:#647180;
}

.wave.active{
animation:pulse .45s infinite alternate;
}

@keyframes pulse{
from{
opacity:.3;
transform:scale(.98);
}
to{
opacity:1;
transform:scale(1.04);
}
}

.meter{
height:8px;
margin:8px 0 17px;
border-radius:10px;
background:#070b10;
overflow:hidden;
}

.meterFill{
width:0%;
height:100%;
background:#5865f2;
transition:width .05s linear;
}

.section{
margin-top:18px;
padding-top:18px;
border-top:1px solid #27313b;
}

.members{
display:flex;
flex-direction:column;
gap:8px;
}

.member{
display:flex;
align-items:center;
gap:10px;
padding:11px;
border-radius:13px;
background:#0a0f14;
border:1px solid #25303a;
}

.avatar{
width:37px;
height:37px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#293540;
font-size:18px;
}

.memberInfo{
flex:1;
min-width:0;
}

.memberName{
font-size:13px;
font-weight:900;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.memberState{
margin-top:2px;
font-size:10px;
color:#778391;
}

.owner{
font-size:10px;
font-weight:1000;
color:#ffd43b;
}

.kick{
width:62px;
height:35px;
margin:0;
border-radius:10px;
background:#45212a;
color:#ff7382;
font-size:10px;
font-weight:1000;
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.control{
height:50px;
border-radius:14px;
background:#293540;
font-weight:1000;
font-size:13px;
}

.locked{
background:#372e13;
color:#ffd43b;
}

input[type=range]{
width:100%;
accent-color:#5865f2;
}

.log{
height:110px;
overflow:auto;
padding:10px;
border-radius:12px;
background:#080c11;
border:1px solid #222c35;
color:#778391;
font:10px monospace;
}

.log div{
margin-bottom:5px;
}

.toast{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
padding:12px 17px;
border-radius:13px;
background:#202a34;
border:1px solid #394652;
box-shadow:0 10px 30px rgba(0,0,0,.4);
font-size:12px;
font-weight:900;
z-index:100;
opacity:0;
pointer-events:none;
transition:.2s;
}

.toast.show{
opacity:1;
}

</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">📻</div>
<h1>WEB WALKIE</h1>
<div class="subtitle">Real-time WebRTC radio</div>
</header>

<main>

<div class="status">
<span id="statusDot" class="dot"></span>
<span id="statusText">Not connected</span>
</div>


<!-- JOIN -->

<section id="joinScreen">

<div class="label">Room Code</div>

<input
id="roomInput"
type="text"
maxlength="20"
autocomplete="off"
autocapitalize="characters"
placeholder="BRYCE123">

<button
id="joinButton"
class="joinButton primary">
📻 JOIN / CREATE ROOM

<button
id="randomButton"
class="joinButton secondary">

<div class="help">
Use the same room code on multiple devices.
The first device becomes the room owner.
</div>

</section>


<!-- WALKIE -->

<section id="walkieScreen" class="hidden">

<div class="live">
🟢 LIVE WALKIE CHANNEL
</div>


<div class="roomInfo">

<div class="roomName">

<div class="label">
Channel
</div>

<div
id="roomDisplay"
class="roomCode">
</div>

</div>

<button
id="copyButton"
class="copyButton">
COPY
</button>

</div>


<div class="radio">

<button
id="talkButton"
class="talk"
disabled>

<span class="talkIcon">
🎙️
</span>

<span class="talkText">
HOLD TO TALK
</span>

</button>

</div>


<div
id="wave"
class="wave">
• • •
</div>


<div
id="talkStatus"
class="talkStatus">
Waiting for connection...
</div>


<div class="label">
Microphone Level
</div>

<div class="meter">

<div
id="micMeter"
class="meterFill">
</div>

</div>


<div class="controls">

<button
id="muteButton"
class="control">
🎙️ Mic On
</button>

<button
id="lockButton"
class="control">
🔓 Room Open
</button>

</div>


<div class="section">

<div class="label">
Participants
</div>

<div
id="members"
class="members">
</div>

</div>


<div class="section">

<div class="label">
Speaker Volume
</div>

<input
id="volume"
type="range"
min="0"
max="1"
value="1"

</div>


<div class="section">

<div class="controls">

<button
id="leaveButton"
class="control danger">
❌ Leave Room
</button>

<button
id="clearButton"
class="control">
🧹 Clear Log
</button>

</div>

</div>


<div class="section">

<div class="label">
Connection Log
</div>

id="log"

</div>

</div>

</main>
</div>


<audio
id="remoteAudio"
autoplay
playsinline
webkit-playsinline>
</audio>

<div
id="toast"
class="toast">
</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyAwziMLKnyFi8of5AbS3NXOmVQwo1Ngn5M",

authDomain:
"web-walkie-talkie-eb91f.firebaseapp.com",

databaseURL:
"https://web-walkie-talkie-eb91f-default-rtdb.europe-west1.firebasedatabase.app",

projectId:
"web-walkie-talkie-eb91f",

storageBucket:
"web-walkie-talkie-eb91f.firebasestorage.app",

messagingSenderId:
"174542114980",

appId:
"1:174542114980:web:f4a48ec7fe322030bdd631"

};

firebase.initializeApp(firebaseConfig);

const auth =
firebase.auth();

const db =
firebase.database();


/* =====================================================
   WEBRTC
===================================================== */

const rtcConfig = {

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
},

{
urls:"stun:stun2.l.google.com:19302"
}

]

};


/* =====================================================
   STATE
===================================================== */

let user=null;

let roomCode="";

let roomRef=null;

let membersRef=null;

let peerConnections={};

let localStream=null;

let remoteStreams={};

let isOwner=false;

let isMuted=false;

let isTalking=false;

let isLocked=false;

let analyser=null;

let audioContext=null;

let meterAnimation=null;

let cleanupDone=false;


/* =====================================================
   ELEMENTS
===================================================== */

const joinScreen=
document.getElementById("joinScreen");

const walkieScreen=
document.getElementById("walkieScreen");

const roomInput=
document.getElementById("roomInput");

const joinButton=
document.getElementById("joinButton");

const randomButton=
document.getElementById("randomButton");

const roomDisplay=
document.getElementById("roomDisplay");

const copyButton=
document.getElementById("copyButton");

const talkButton=
document.getElementById("talkButton");

const muteButton=
document.getElementById("muteButton");

const lockButton=
document.getElementById("lockButton");

const leaveButton=
document.getElementById("leaveButton");

const clearButton=
document.getElementById("clearButton");

const membersBox=
document.getElementById("members");

const statusText=
document.getElementById("statusText");

const statusDot=
document.getElementById("statusDot");

const talkStatus=
document.getElementById("talkStatus");

const wave=
document.getElementById("wave");

const remoteAudio=
document.getElementById("remoteAudio");

const volume=
document.getElementById("volume");

const logBox=
document.getElementById("log");

const micMeter=
document.getElementById("micMeter");

const toast=
document.getElementById("toast");


/* =====================================================
   LOG
===================================================== */

function log(text){

const line=
document.createElement("div");

line.textContent=
new Date().toLocaleTimeString()+
" — "+
text;

logBox.appendChild(line);

logBox.scrollTop=
logBox.scrollHeight;

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer=null;

function showToast(text){

toast.textContent=text;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
2200
);

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type){

statusText.textContent=text;

statusDot.className="dot";

if(type){
statusDot.classList.add(type);
}

}


/* =====================================================
   AUTH
===================================================== */

async function authenticate(){

if(auth.currentUser){

user=auth.currentUser;

return user;

}

log("🔐 Signing in...");

const result=
await auth.signInAnonymously();

user=result.user;

log("🔐 Signed in.");

return user;

}


/* =====================================================
   MICROPHONE
===================================================== */

async function getMicrophone(){

if(localStream){

return localStream;

}

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Microphone is unavailable in this browser."
);

}

localStream=
await navigator.mediaDevices.getUserMedia({

audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
},

video:false

});

localStream
.getAudioTracks()
.forEach(
track=>{
track.enabled=false;
}
);

setupMeter();

log("🎙️ Microphone ready.");

return localStream;

}


/* =====================================================
   MIC METER
===================================================== */

function setupMeter(){

try{

audioContext=
new (
window.AudioContext ||
window.webkitAudioContext
)();

const source=
audioContext.createMediaStreamSource(
localStream
);

analyser=
audioContext.createAnalyser();

analyser.fftSize=256;

source.connect(analyser);

const data=
new Uint8Array(
analyser.frequencyBinCount
);

function update(){

if(!analyser){
return;
}

analyser.getByteTimeDomainData(data);

let total=0;

for(let i=0;i<data.length;i++){

const v=
(data[i]-128)/128;

total+=v*v;

}

const rms=
Math.sqrt(total/data.length);

const level=
Math.min(
100,
Math.round(rms*300)
);

micMeter.style.width=
level+"%";

meterAnimation=
requestAnimationFrame(update);

}

update();

}
catch(e){

log("Mic meter unavailable.");

}

}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeer(remoteId){

const pc=
new RTCPeerConnection(
rtcConfig
);

peerConnections[remoteId]=pc;

remoteStreams[remoteId]=
new MediaStream();


pc.ontrack=
event=>{

event.streams[0]
.getTracks()
.forEach(
track=>{
remoteStreams[remoteId]
.addTrack(track);
}
);

remoteAudio.srcObject=
remoteStreams[remoteId];

remoteAudio.volume=
Number(volume.value);

remoteAudio.play()
.catch(
()=>{}
);

};


pc.onicecandidate=
event=>{

if(!event.candidate){
return;
}

roomRef
.child("signals")
.child(remoteId)
.child(user.uid)
.child("candidates")
.push(
event.candidate.toJSON()
);

};


pc.onconnectionstatechange=
()=>{

const state=
pc.connectionState;

log(
"Connection "+
remoteId.slice(0,5)+
": "+
state
);

};


if(localStream){

localStream
.getTracks()
.forEach(
track=>{
pc.addTrack(
track,
localStream
);
}
);

}

return pc;

}


/* =====================================================
   MEMBER LIST
===================================================== */

function listenForMembers(){

membersRef=
roomRef.child("members");

membersRef.on(
"value",
snapshot=>{

const members=
snapshot.val()||{};

membersBox.innerHTML="";

Object.entries(members)
.forEach(
([uid,member])=>{

const row=
document.createElement("div");

row.className="member";

const avatar=
document.createElement("div");

avatar.className="avatar";

avatar.textContent=
uid===user.uid
?"📱"
:"👤";

const info=
document.createElement("div");

info.className="memberInfo";

const name=
document.createElement("div");

name.className="memberName";

name.textContent=
member.name||
"Walkie Device";

const state=
document.createElement("div");

state.className="memberState";

state.textContent=
uid===user.uid
?"You"
:"Online";

info.appendChild(name);

info.appendChild(state);

const owner=
document.createElement("span");

owner.className="owner";

if(uid===members.owner){
owner.textContent="OWNER";
}

if(uid===roomOwnerId()){
owner.textContent="OWNER";
}

const avatarWrap=
avatar;

row.appendChild(
avatarWrap
);

row.appendChild(
info
);

row.appendChild(
owner
);


/* KICK */

if(
isOwner &&
uid!==user.uid
){

const kick=
document.createElement("button");

kick.className="kick";

kick.textContent="KICK";

kick.onclick=
()=>{
kickMember(uid);
};

row.appendChild(kick);

}

membersBox.appendChild(row);

}

);

}
);

}


/* =====================================================
   OWNER ID
===================================================== */

function roomOwnerId(){

let owner=null;

return owner;

}


/* =====================================================
   KICK
===================================================== */

async function kickMember(uid){

if(!isOwner){

return;

}

if(!confirm(
"Kick this device from the room?"
)){

return;

}

await roomRef
.child("kicked")
.child(uid)
.set(true);

await roomRef
.child("members")
.child(uid)
.remove();

showToast("Device kicked.");

log(
"🦶 Device "+
uid.slice(0,6)+
" kicked."
);

}


/* =====================================================
   KICK LISTENER
===================================================== */

function listenForKick(){

roomRef
.child("kicked")
.child(user.uid)
.on(
"value",
snapshot=>{

if(snapshot.val()===true){

alert(
"You were kicked from this room."
);

cleanup();

}

}
);

}


/* =====================================================
   ROOM LOCK
===================================================== */

function listenForLock(){

roomRef
.child("locked")
.on(
"value",
snapshot=>{

isLocked=
snapshot.val()===true;

if(isOwner){

lockButton.textContent=
isLocked
?"🔒 Room Locked"
:"🔓 Room Open";

lockButton.className=
isLocked
?"control locked"
:"control";

}

}
);

}


/* =====================================================
   CREATE ROOM
===================================================== */

async function createRoom(){

isOwner=true;

roomRef=
db.ref(
"walkieRooms/"+roomCode
);

await roomRef.set({

owner:user.uid,

createdAt:
firebase.database.ServerValue.TIMESTAMP,

locked:false,

members:{
[user.uid]:{
name:"My Device",
joinedAt:
firebase.database.ServerValue.TIMESTAMP
}
}

});

log("👑 You are the room owner.");

listenForMembers();

listenForKick();

listenForLock();

setStatus(
"Waiting for devices...",
"yellow"
);

talkStatus.textContent=
"Waiting for another device...";

}


/* =====================================================
   JOIN EXISTING ROOM
===================================================== */

async function joinExisting(){

isOwner=false;

roomRef=
db.ref(
"walkieRooms/"+roomCode
);

const snap=
await roomRef.once("value");

const data=
snap.val();

if(!data){

throw new Error(
"Room disappeared."
);

}

if(
data.locked
){

throw new Error(
"This room is locked."
);

}

await roomRef
.child("members")
.child(user.uid)
.set({

name:"My Device",

joinedAt:
firebase.database.ServerValue.TIMESTAMP

});

listenForMembers();

listenForKick();

listenForLock();

setStatus(
"Joining room...",
"yellow"
);

log(
"📻 Joined existing room."
);

}


/* =====================================================
   SIMPLE MULTI PEER SIGNALING
===================================================== */

async function connectToMembers(){

const snap=
await roomRef
.child("members")
.once("value");

const members=
snap.val()||{};

for(
const uid of Object.keys(members)
){

if(
uid===user.uid ||
peerConnections[uid]
){

continue;

}

await connectPeer(uid);

}

}


/* =====================================================
   CONNECT PEER
===================================================== */

async function connectPeer(remoteId){

const pc=
createPeer(remoteId);


/*
 * Determine which device creates
 * the offer using UID ordering.
 */

const shouldOffer=
user.uid < remoteId;

if(shouldOffer){

const offer=
await pc.createOffer();

await pc.setLocalDescription(
offer
);

await roomRef
.child("signals")
.child(remoteId)
.child(user.uid)
.child("offer")
.set({

type:offer.type,
sdp:offer.sdp

});

}


/*
 * Listen for offer.
 */

roomRef
.child("signals")
.child(user.uid)
.child(remoteId)
.child("offer")
.on(
"value",
async snapshot=>{

const offer=
snapshot.val();

if(
!offer ||
pc.currentRemoteDescription
){

return;

}

await pc.setRemoteDescription(
new RTCSessionDescription(
offer
)
);

const answer=
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await roomRef
.child("signals")
.child(remoteId)
.child(user.uid)
.child("answer")
.set({

type:answer.type,
sdp:answer.sdp

});

}
);


/*
 * Listen for answer.
 */

roomRef
.child("signals")
.child(user.uid)
.child(remoteId)
.child("answer")
.on(
"value",
async snapshot=>{

const answer=
snapshot.val();

if(
!answer ||
pc.currentRemoteDescription
){

return;

}

await pc.setRemoteDescription(
new RTCSessionDescription(
answer
)
);

}
);


/*
 * Candidate listeners.
 */

roomRef
.child("signals")
.child(user.uid)
.child(remoteId)
.child("candidates")
.on(
"child_added",
async snapshot=>{

try{

await pc.addIceCandidate(
new RTCIceCandidate(
snapshot.val()
)
);

}
catch(e){}

}
);


roomRef
.child("signals")
.child(remoteId)
.child(user.uid)
.child("candidates")
.on(
"child_added",
async snapshot=>{

try{

await pc.addIceCandidate(
new RTCIceCandidate(
snapshot.val()
)
);

}
catch(e){}

}
);

}


/* =====================================================
   WATCH MEMBERS
===================================================== */

function watchMembers(){

roomRef
.child("members")
.on(
"value",
async snapshot=>{

const members=
snapshot.val()||{};

if(!members[user.uid]){

return;

}

await connectToMembers();

const count=
Object.keys(members).length;

if(count>1){

setStatus(
"Connected • "+
count+
" devices",
"green"
);

talkButton.disabled=false;

talkStatus.textContent=
"Ready";

}

else{

setStatus(
"Waiting for devices...",
"yellow"
);

talkButton.disabled=true;

talkStatus.textContent=
"Waiting for another device...";

}

}
);

}


/* =====================================================
   JOIN
===================================================== */

joinButton.onclick=
async function(){

const code=
roomInput.value
.trim()
.toUpperCase()
.replace(
/[^A-Z0-9]/g,
""
);

if(!code){

showToast(
"Enter a room code."
);

return;

}

roomCode=code;

joinButton.disabled=true;

randomButton.disabled=true;

setStatus(
"Starting...",
"yellow"
);

try{

await authenticate();

await getMicrophone();

roomDisplay.textContent=
roomCode;

joinScreen.classList.add(
"hidden"
);

walkieScreen.classList.remove(
"hidden"
);

roomRef=
db.ref(
"walkieRooms/"+roomCode
);

const snap=
await roomRef.once("value");

if(
snap.exists()
){

await joinExisting();

}
else{

await createRoom();

}

watchMembers();

}
catch(error){

console.error(error);

alert(
"Could not join:\n\n"+
error.message
);

cleanup();

joinButton.disabled=false;

randomButton.disabled=false;

}

};


/* =====================================================
   RANDOM ROOM
===================================================== */

randomButton.onclick=
()=>{

const chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code="";

for(
let i=0;
i<6;
i++
){

code+=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

roomInput.value=code;

};


/* =====================================================
   COPY
===================================================== */

copyButton.onclick=
async()=>{

try{

await navigator.clipboard.writeText(
roomCode
);

showToast(
"Room code copied!"
);

}
catch(e){

showToast(
"Room: "+roomCode
);

}

};


/* =====================================================
   TALK
===================================================== */

function startTalking(e){

e.preventDefault();

if(
!peerConnections ||
Object.keys(peerConnections).length===0
){

return;

}

if(
isMuted ||
isTalking
){

return;

}

isTalking=true;

talkButton.classList.add(
"active"
);

wave.classList.add(
"active"
);

talkStatus.textContent=
"🔴 TRANSMITTING";

if(localStream){

localStream
.getAudioTracks()
.forEach(
track=>{
track.enabled=true;
}
);

}

}


function stopTalking(e){

if(e){
e.preventDefault();
}

if(!isTalking){
return;
}

isTalking=false;

talkButton.classList.remove(
"active"
);

wave.classList.remove(
"active"
);

talkStatus.textContent=
"Ready";

if(localStream){

localStream
.getAudioTracks()
.forEach(
track=>{
track.enabled=false;
}
);

}

}


/* =====================================================
   TOUCH / POINTER
===================================================== */

talkButton.addEventListener(
"pointerdown",
startTalking
);

talkButton.addEventListener(
"pointerup",
stopTalking
);

talkButton.addEventListener(
"pointercancel",
stopTalking
);

talkButton.addEventListener(
"pointerleave",
stopTalking
);

window.addEventListener(
"blur",
stopTalking
);


/* =====================================================
   MUTE
===================================================== */

muteButton.onclick=
()=>{

isMuted=
!isMuted;

if(isMuted){

muteButton.textContent=
"🔇 Mic Muted";

muteButton.classList.add(
"danger"
);

stopTalking();

}
else{

muteButton.textContent=
"🎙️ Mic On";

muteButton.classList.remove(
"danger"
);

}

};


/* =====================================================
   LOCK
===================================================== */

lockButton.onclick=
async()=>{

if(!isOwner){

showToast(
"Only the owner can lock the room."
);

return;

}

const newState=
!isLocked;

await roomRef
.child("locked")
.set(newState);

showToast(
newState
?"Room locked"
:"Room unlocked"
);

};


/* =====================================================
   VOLUME
===================================================== */

volume.oninput=
()=>{

remoteAudio.volume=
Number(volume.value);

};


/* =====================================================
   CLEAR LOG
===================================================== */

clearButton.onclick=
()=>{

logBox.innerHTML="";

};


/* =====================================================
   LEAVE
===================================================== */

leaveButton.onclick=
()=>{

cleanup();

};


/* =====================================================
   CLEANUP
===================================================== */

async function cleanup(){

if(cleanupDone){
return;
}

cleanupDone=true;

stopTalking();

if(meterAnimation){

cancelAnimationFrame(
meterAnimation
);

}

if(membersRef){

membersRef.off();

}

if(roomRef){

roomRef
.child("kicked")
.child(user?.uid||"")
.off();

roomRef
.child("locked")
.off();

roomRef
.child("members")
.off();

}

for(
const pc of Object.values(
peerConnections
)
){

try{
pc.close();
}
catch(e){}

}

peerConnections={};

if(localStream){

localStream
.getTracks()
.forEach(
track=>{
track.stop();
}
);

}

if(audioContext){

try{
await audioContext.close();
}
catch(e){}

}

remoteAudio.srcObject=null;

localStream=null;

roomRef=null;

roomCode="";

isOwner=false;

isLocked=false;

joinScreen.classList.remove(
"hidden"
);

walkieScreen.classList.add(
"hidden"
);

joinButton.disabled=false;

randomButton.disabled=false;

talkButton.disabled=true;

setStatus(
"Not connected"
);

talkStatus.textContent=
"Waiting for connection...";

logBox.innerHTML="";

cleanupDone=false;

}


/* =====================================================
   PAGE SAFETY
===================================================== */

document.addEventListener(
"visibilitychange",
()=>{

if(document.hidden){

stopTalking();

}

}
);


/* =====================================================
   START
===================================================== */

log(
"📻 Web Walkie v2 loaded."
);

log(
"🔒 HTTPS: "+
(
location.protocol==="https:"
?"YES"
:"NO"
)
);

</script>

</body>
</html>
