<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Live Camera</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0;
  background:#070a0f;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:20px;
}
.app{
  max-width:600px;
  margin:auto;
}
h1{
  text-align:center;
  margin:10px 0;
}
.status{
  margin:15px 0;
  padding:12px;
  border-radius:12px;
  background:#141a22;
  text-align:center;
  font-weight:800;
}
input{
  width:100%;
  height:55px;
  border:1px solid #303a46;
  border-radius:14px;
  background:#11161d;
  color:white;
  font-size:20px;
  text-align:center;
  text-transform:uppercase;
  outline:none;
}
button{
  width:100%;
  height:55px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:#5865f2;
  color:white;
  font-size:16px;
  font-weight:900;
}
button:disabled{
  opacity:.45;
}
.stop{
  background:#e33d52;
}
.gray{
  background:#29333f;
}
video{
  width:100%;
  margin-top:12px;
  border-radius:16px;
  background:#000;
  display:block;
}
#localVideo{
  max-height:300px;
  object-fit:cover;
}
#remoteVideo{
  max-height:500px;
  object-fit:contain;
}
.hidden{
  display:none!important;
}
.label{
  margin-top:18px;
  margin-bottom:7px;
  color:#7e8996;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}
.room{
  text-align:center;
  font-size:27px;
  font-weight:1000;
  letter-spacing:5px;
}
#debug{
  margin-top:15px;
  padding:10px;
  height:120px;
  overflow:auto;
  border-radius:10px;
  background:#05070a;
  color:#7f8a98;
  font:11px monospace;
}
</style>
</head>
<body>
<div class="app">
<h1>📹 LIVE CAMERA</h1>
<div id="join">
  <div class="label">
    Room Code
  </div>
  <input
    id="code"
    placeholder="CAM123"
    maxlength="12"
    autocomplete="off"
    autocapitalize="characters"
  >
  <button id="joinBtn">
    JOIN ROOM
  </button>
</div>
<div id="room" class="hidden">
  <div id="status" class="status">
    Connecting...
  </div>
  <div class="label">
    Room
  </div>
  <div id="roomName" class="room"></div>
  <div class="label">
    Remote Live Camera
  </div>
  <video
    id="remoteVideo"
    autoplay
    playsinline
    webkit-playsinline>
  </video>
  <div class="label">
    Your Camera
  </div>
  <video
    id="localVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline>
  </video>
  <button id="startCamera">
    📹 START CAMERA
  </button>
  <button
    id="stopCamera"
    class="stop"
    disabled>
    🛑 STOP CAMERA
  </button>
  <button
    id="leave"
    class="gray">
    LEAVE
  </button>
  <div id="debug"></div>
</div>
</div>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* =========================================================
   FIREBASE
========================================================= */
const firebaseConfig = {
  apiKey:
  "AIzaSyAwziMLKnyFi8of5AbS3NXOmVQwo1Ngn5M",
  authDomain:
  "web-walkie-talkie-eb91f.firebaseapp.com",
  databaseURL:
  "https://web-walkie-talkie-eb91f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:
  "web-walkie-talkie-eb91f",
  storageBucket:
  "web-walkie-talkie-eb91f.firebasestorage.app",
  messagingSenderId:
  "174542114980",
  appId:
  "1:174542114980:web:f4a48ec7fe322030bdd631"
};
firebase.initializeApp(firebaseConfig);
const auth =
firebase.auth();
const db =
firebase.database();
/* =========================================================
   WEBRTC
========================================================= */
const rtcConfig = {
  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    },
    {
      urls:"stun:stun1.l.google.com:19302"
    }
  ]
};
/* =========================================================
   STATE
========================================================= */
let uid = null;
let roomCode = "";
let roomRef = null;
let peer = null;
let localStream = null;
let isHost = false;
let hostUid = null;
let remoteUid = null;
/* =========================================================
   ELEMENTS
========================================================= */
const join =
document.getElementById("join");
const room =
document.getElementById("room");
const code =
document.getElementById("code");
const joinBtn =
document.getElementById("joinBtn");
const status =
document.getElementById("status");
const roomName =
document.getElementById("roomName");
const localVideo =
document.getElementById("localVideo");
const remoteVideo =
document.getElementById("remoteVideo");
const startCamera =
document.getElementById("startCamera");
const stopCamera =
document.getElementById("stopCamera");
const leave =
document.getElementById("leave");
const debug =
document.getElementById("debug");
/* =========================================================
   DEBUG
========================================================= */
function log(text){
  console.log(text);
  const line =
  document.createElement("div");
  line.textContent =
  new Date().toLocaleTimeString()+
  " | "+
  text;
  debug.appendChild(line);
  debug.scrollTop =
  debug.scrollHeight;
}
/* =========================================================
   AUTH
========================================================= */
async function login(){
  if(auth.currentUser){
    uid =
    auth.currentUser.uid;
    return;
  }
  const result =
  await auth.signInAnonymously();
  uid =
  result.user.uid;
  log(
    "Firebase user: "+
    uid.substring(0,8)
  );
}
/* =========================================================
   CREATE PEER
========================================================= */
function createPeer(){
  if(peer){
    return peer;
  }
  peer =
  new RTCPeerConnection(
    rtcConfig
  );
  /*
   * THIS VIDEO TRANSCEIVER EXISTS
   * BEFORE THE CAMERA STARTS.
   */
  peer.addTransceiver(
    "video",
    {
      direction:"sendrecv"
    }
  );
  /*
   * RECEIVE REMOTE VIDEO
   */
  peer.ontrack =
  function(event){
    log(
      "REMOTE TRACK: "+
      event.track.kind
    );
    if(
      event.track.kind === "video"
    ){
      const stream =
      event.streams[0];
      if(stream){
        remoteVideo.srcObject =
        stream;
        remoteVideo.play()
          .then(
            ()=>{
              log(
                "REMOTE VIDEO PLAYING"
              );
            }
          )
          .catch(
            error=>{
              log(
                "VIDEO PLAY ERROR: "+
                error.message
              );
            }
          );
      }
    }
  };
  /*
   * ICE CANDIDATES
   */
  peer.onicecandidate =
  function(event){
    if(
      !event.candidate
    ){
      return;
    }
    const candidate =
    event.candidate.toJSON();
    /*
     * HOST SENDS CANDIDATES
     * TO VIEWER.
     */
    if(isHost){
      roomRef
        .child("hostIce")
        .push(candidate);
    }
    /*
     * VIEWER SENDS CANDIDATES
     * TO HOST.
     */
    else{
      roomRef
        .child("viewerIce")
        .push(candidate);
    }
  };
  /*
   * CONNECTION STATE
   */
  peer.onconnectionstatechange =
  function(){
    log(
      "CONNECTION: "+
      peer.connectionState
    );
    if(
      peer.connectionState ===
      "connected"
    ){
      status.textContent =
      "🟢 WEBRTC CONNECTED";
    }
    if(
      peer.connectionState ===
      "connecting"
    ){
      status.textContent =
      "🟡 CONNECTING...";
    }
    if(
      peer.connectionState ===
      "failed"
    ){
      status.textContent =
      "🔴 CONNECTION FAILED";
    }
  };
  return peer;
}
/* =========================================================
   HOST
========================================================= */
async function setupHost(){
  isHost=true;
  hostUid =
  uid;
  log(
    "YOU ARE HOST"
  );
  createPeer();
  /*
   * HOST CREATES OFFER
   */
  const offer =
  await peer.createOffer();
  await peer.setLocalDescription(
    offer
  );
  await roomRef
    .child("offer")
    .set({
      type:
      offer.type,
      sdp:
      offer.sdp
    });
  log(
    "OFFER SENT"
  );
  status.textContent =
  "🟡 WAITING FOR PHONE...";
  /*
   * WAIT FOR ANSWER
   */
  roomRef
    .child("answer")
    .on(
      "value",
      async snapshot=>{
        const answer =
        snapshot.val();
        if(!answer){
          return;
        }
        if(
          peer.signalingState !==
          "have-local-offer"
        ){
          return;
        }
        log(
          "ANSWER RECEIVED"
        );
        await peer.setRemoteDescription(
          new RTCSessionDescription(
            answer
          )
        );
        log(
          "REMOTE DESCRIPTION SET"
        );
      }
    );
  /*
   * RECEIVE VIEWER ICE
   */
  roomRef
    .child("viewerIce")
    .on(
      "child_added",
      async snapshot=>{
        try{
          await peer.addIceCandidate(
            new RTCIceCandidate(
              snapshot.val()
            )
          );
          log(
            "VIEWER ICE ADDED"
          );
        }
        catch(error){
          log(
            "VIEWER ICE ERROR: "+
            error.message
          );
        }
      }
    );
}
/* =========================================================
   VIEWER
========================================================= */
async function setupViewer(){
  isHost=false;
  log(
    "YOU ARE VIEWER"
  );
  createPeer();
  /*
   * WAIT FOR OFFER
   */
  roomRef
    .child("offer")
    .on(
      "value",
      async snapshot=>{
        const offer =
        snapshot.val();
        if(!offer){
          return;
        }
        if(
          peer.signalingState !==
          "stable"
        ){
          return;
        }
        log(
          "OFFER RECEIVED"
        );
        await peer.setRemoteDescription(
          new RTCSessionDescription(
            offer
          )
        );
        log(
          "REMOTE DESCRIPTION SET"
        );
        /*
         * CREATE ANSWER
         */
        const answer =
        await peer.createAnswer();
        await peer.setLocalDescription(
          answer
        );
        await roomRef
          .child("answer")
          .set({
            type:
            answer.type,
            sdp:
            answer.sdp
          });
        log(
          "ANSWER SENT"
        );
      }
    );
  /*
   * RECEIVE HOST ICE
   */
  roomRef
    .child("hostIce")
    .on(
      "child_added",
      async snapshot=>{
        try{
          await peer.addIceCandidate(
            new RTCIceCandidate(
              snapshot.val()
            )
          );
          log(
            "HOST ICE ADDED"
          );
        }
        catch(error){
          log(
            "HOST ICE ERROR: "+
            error.message
          );
        }
      }
    );
}
/* =========================================================
   START CAMERA
========================================================= */
startCamera.onclick =
async function(){
  try{
    log(
      "REQUESTING CAMERA..."
    );
    /*
     * CAMERA PERMISSION MUST BE
     * REQUESTED FROM THE BUTTON.
     */
    localStream =
    await navigator.mediaDevices
      .getUserMedia({
        video:{
          facingMode:"user",
          width:{
            ideal:1280
          },
          height:{
            ideal:720
          },
          frameRate:{
            ideal:30
          }
        },
        audio:false
      });
    log(
      "CAMERA PERMISSION GRANTED"
    );
    /*
     * SHOW OUR OWN CAMERA
     */
    localVideo.srcObject =
    localStream;
    await localVideo.play();
    /*
     * FIND VIDEO TRANSCEIVER
     */
    const transceiver =
    peer
      .getTransceivers()
      .find(
        t =>
          t.receiver &&
          t.receiver.track &&
          t.receiver.track.kind ===
          "video"
      );
    if(!transceiver){
      throw new Error(
        "No WebRTC video transceiver."
      );
    }
    const track =
    localStream
      .getVideoTracks()[0];
    /*
     * PUT CAMERA INTO WEBRTC
     */
    await transceiver
      .sender
      .replaceTrack(track);
    log(
      "CAMERA TRACK ATTACHED TO WEBRTC"
    );
    startCamera.disabled =
    true;
    stopCamera.disabled =
    false;
    status.textContent =
    "📹 CAMERA IS LIVE";
  }
  catch(error){
    console.error(error);
    log(
      "CAMERA ERROR: "+
      error.name+
      " / "+
      error.message
    );
    alert(
      "Camera error:\n\n"+
      error.name+
      "\n"+
      error.message
    );
  }
};
/* =========================================================
   STOP CAMERA
========================================================= */
stopCamera.onclick =
async function(){
  if(!localStream){
    return;
  }
  const track =
  localStream
    .getVideoTracks()[0];
  const transceiver =
  peer
    .getTransceivers()
    .find(
      t =>
        t.receiver &&
        t.receiver.track &&
        t.receiver.track.kind ===
        "video"
    );
  if(transceiver){
    await transceiver
      .sender
      .replaceTrack(null);
  }
  if(track){
    track.stop();
  }
  localStream=null;
  localVideo.srcObject=null;
  startCamera.disabled=false;
  stopCamera.disabled=true;
  status.textContent =
  "Camera stopped";
  log(
    "CAMERA STOPPED"
  );
};
/* =========================================================
   JOIN
========================================================= */
joinBtn.onclick =
async function(){
  const entered =
  code.value
    .trim()
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ""
    );
  if(!entered){
    alert(
      "Enter a room code."
    );
    return;
  }
  joinBtn.disabled=true;
  try{
    await login();
    roomCode =
    entered;
    roomName.textContent =
    roomCode;
    roomRef =
    db.ref(
      "liveCameraRooms/"+
      roomCode
    );
    const snapshot =
    await roomRef.once(
      "value"
    );
    /*
     * FIRST DEVICE = HOST
     */
    if(!snapshot.exists()){
      await roomRef.set({
        host:uid,
        createdAt:
        firebase.database.ServerValue.TIMESTAMP
      });
      log(
        "ROOM CREATED"
      );
      isHost=true;
    }
    else{
      /*
       * SECOND DEVICE = VIEWER
       */
      const data =
      snapshot.val();
      if(data.host === uid){
        isHost=true;
      }
      else{
        isHost=false;
      }
    }
    join.classList.add(
      "hidden"
    );
    room.classList.remove(
      "hidden"
    );
    createPeer();
    if(isHost){
      await setupHost();
    }
    else{
      await setupViewer();
    }
  }
  catch(error){
    console.error(error);
    alert(
      "Join failed:\n\n"+
      error.message
    );
    joinBtn.disabled=false;
  }
};
/* =========================================================
   LEAVE
========================================================= */
leave.onclick =
async function(){
  if(localStream){
    localStream
      .getTracks()
      .forEach(
        track =>
        track.stop()
      );
  }
  if(peer){
    peer.close();
  }
  location.reload();
};
</script>
</body>
</html>
