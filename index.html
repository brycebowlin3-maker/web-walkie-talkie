<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Web Walkie Talkie</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body {
  margin:0;
  min-height:100%;
  background:#080b10;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body {
  padding:
    max(15px,env(safe-area-inset-top))
    max(15px,env(safe-area-inset-right))
    max(15px,env(safe-area-inset-bottom))
    max(15px,env(safe-area-inset-left));
}

.app {
  max-width:500px;
  min-height:calc(100vh - 30px);
  margin:auto;
  background:#121820;
  border:1px solid #293441;
  border-radius:28px;
  overflow:hidden;
}

header {
  text-align:center;
  padding:25px 20px;
  background:#171f29;
  border-bottom:1px solid #293441;
}

.logo {
  font-size:46px;
}

h1 {
  margin:5px 0 0;
  font-size:28px;
}

.sub {
  color:#8995a4;
  margin-top:4px;
  font-size:13px;
}

main {
  padding:20px;
}

.status {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:13px;
  border-radius:15px;
  background:#0a0f15;
  border:1px solid #293441;
  font-weight:800;
  margin-bottom:20px;
}

.dot {
  width:11px;
  height:11px;
  border-radius:50%;
  background:#687483;
}

.dot.yellow {
  background:#ffd43b;
  box-shadow:0 0 12px #ffd43b;
}

.dot.green {
  background:#2ee875;
  box-shadow:0 0 12px #2ee875;
}

.dot.red {
  background:#ff4757;
  box-shadow:0 0 12px #ff4757;
}

.label {
  font-size:11px;
  color:#7e8b9a;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}

input[type=text] {
  width:100%;
  height:55px;
  border-radius:14px;
  border:1px solid #34404d;
  background:#090e14;
  color:white;
  outline:none;
  padding:0 16px;
  font-size:18px;
  font-weight:800;
  text-transform:uppercase;
}

input[type=text]:focus {
  border-color:#6674ff;
}

button {
  width:100%;
  min-height:54px;
  margin-top:10px;
  border:0;
  border-radius:15px;
  background:#293542;
  color:white;
  font-size:15px;
  font-weight:900;
  touch-action:manipulation;
}

button:active {
  transform:scale(.98);
}

button:disabled {
  opacity:.45;
}

.primary {
  background:#5865f2;
}

.danger {
  background:#d9364f;
}

.hidden {
  display:none!important;
}

.info {
  color:#7e8997;
  font-size:12px;
  line-height:1.5;
  margin-top:10px;
}

.live {
  text-align:center;
  padding:12px;
  border-radius:14px;
  color:#7cf5a8;
  background:rgba(46,232,117,.08);
  border:1px solid rgba(46,232,117,.2);
  font-weight:900;
}

.roomTitle {
  text-align:center;
  color:#7e8997;
  font-size:11px;
  margin-top:18px;
}

.roomCode {
  text-align:center;
  font-size:28px;
  font-weight:1000;
  letter-spacing:4px;
  margin-top:3px;
}

.radio {
  width:250px;
  height:250px;
  margin:22px auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1b242e;
  border:10px solid #2e3946;
  box-shadow:
    inset 0 0 35px rgba(0,0,0,.8),
    0 20px 50px rgba(0,0,0,.35);
}

.talk {
  width:155px;
  height:155px;
  margin:0;
  border-radius:50%;
  background:#5865f2;
  border:8px solid #3c4657;
  box-shadow:0 8px 30px rgba(88,101,242,.4);
}

.talk.active {
  background:#e0314f;
  box-shadow:0 0 45px rgba(224,49,79,.7);
}

.talkIcon {
  display:block;
  font-size:34px;
}

.talkText {
  display:block;
  font-size:13px;
  margin-top:4px;
}

.talkStatus {
  text-align:center;
  font-weight:900;
  margin-bottom:18px;
}

.wave {
  text-align:center;
  color:#647180;
  font-size:24px;
  letter-spacing:7px;
  height:30px;
}

.wave.active {
  animation:pulse .5s infinite alternate;
}

@keyframes pulse {
  from {opacity:.35}
  to {opacity:1}
}

.controls {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.controls button {
  margin:0;
}

.divider {
  height:1px;
  background:#293441;
  margin:22px 0;
}

input[type=range] {
  width:100%;
}

.log {
  max-height:130px;
  overflow:auto;
  padding:11px;
  border-radius:13px;
  background:#090e14;
  border:1px solid #252f3a;
  color:#8793a2;
  font:11px monospace;
}

.log div {
  margin-bottom:5px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">📻</div>
  <h1>WEB WALKIE</h1>
  <div class="sub">Live WebRTC voice</div>
</header>

<main>

<div class="status">
  <span id="dot" class="dot"></span>
  <span id="status">Not connected</span>
</div>

<!-- JOIN -->

<section id="join">

  <div class="label">Room Code</div>

  <input
    id="room"
    type="text"
    maxlength="20"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="BRYCE123">

  <button
    id="joinBtn"
    class="primary">
    📻 JOIN ROOM
  </button>

  <button id="randomBtn">
    🎲 RANDOM ROOM
  </button>

  <div class="info">
    Enter the same room code on two devices.
    The first device waits and the second device
    automatically connects.
  </div>

</section>

<!-- WALKIE -->

<section
  id="walkie"
  class="hidden">

  <div class="live">
    🟢 WEBRTC READY
  </div>

  <div class="roomTitle">
    ROOM
  </div>

  <div
    id="roomDisplay"
    class="roomCode">
  </div>

  <div class="radio">

    <button
      id="talk"
      class="talk"
      disabled>

      <span class="talkIcon">🎙️</span>

      <span class="talkText">
        HOLD TO TALK
      </span>

    </button>

  </div>

  <div
    id="wave"
    class="wave">
    • • •
  </div>

  <div
    id="talkStatus"
    class="talkStatus">
    Waiting for connection...
  </div>

  <div class="controls">

    <button id="mute">
      🎙️ Mic On
    </button>

    <button
      id="leave"
      class="danger">
      ❌ Leave
    </button>

  </div>

  <div class="divider"></div>

  <div class="label">
    Speaker Volume
  </div>

  <input
    id="volume"
    type="range"
    min="0"
    max="1"
    value="1"
    step=".01">

  <div class="divider"></div>

  <div class="label">
    Connection Log
  </div>

  <div id="log" class="log"></div>

</section>

</main>
</div>

<audio
  id="remoteAudio"
  autoplay
  playsinline
  webkit-playsinline>
</audio>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey:
    "AIzaSyAwziMLKnyFi8of5AbS3NXOmVQwo1Ngn5M",

  authDomain:
    "web-walkie-talkie-eb91f.firebaseapp.com",

  databaseURL:
    "https://web-walkie-talkie-eb91f-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "web-walkie-talkie-eb91f",

  storageBucket:
    "web-walkie-talkie-eb91f.firebasestorage.app",

  messagingSenderId:
    "174542114980",

  appId:
    "1:174542114980:web:f4a48ec7fe322030bdd631"
};

firebase.initializeApp(firebaseConfig);

const database =
  firebase.database();


/* =====================================================
   WEBRTC
===================================================== */

const rtcConfig = {
  iceServers: [
    {
      urls:"stun:stun.l.google.com:19302"
    },
    {
      urls:"stun:stun1.l.google.com:19302"
    },
    {
      urls:"stun:stun2.l.google.com:19302"
    }
  ]
};


/* =====================================================
   STATE
===================================================== */

let roomCode = "";

let roomRef = null;

let peer = null;

let localStream = null;

let remoteStream = null;

let isCaller = false;

let isMuted = false;

let isTalking = false;


/* =====================================================
   ELEMENTS
===================================================== */

const join =
  document.getElementById("join");

const walkie =
  document.getElementById("walkie");

const roomInput =
  document.getElementById("room");

const joinBtn =
  document.getElementById("joinBtn");

const randomBtn =
  document.getElementById("randomBtn");

const talk =
  document.getElementById("talk");

const mute =
  document.getElementById("mute");

const leave =
  document.getElementById("leave");

const status =
  document.getElementById("status");

const dot =
  document.getElementById("dot");

const roomDisplay =
  document.getElementById("roomDisplay");

const talkStatus =
  document.getElementById("talkStatus");

const wave =
  document.getElementById("wave");

const remoteAudio =
  document.getElementById("remoteAudio");

const volume =
  document.getElementById("volume");

const logBox =
  document.getElementById("log");


/* =====================================================
   LOG
===================================================== */

function log(message) {

  const div =
    document.createElement("div");

  div.textContent =
    new Date().toLocaleTimeString() +
    " — " +
    message;

  logBox.appendChild(div);

  logBox.scrollTop =
    logBox.scrollHeight;
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type) {

  status.textContent =
    text;

  dot.className =
    "dot";

  if(type) {
    dot.classList.add(type);
  }
}


/* =====================================================
   RANDOM ROOM
===================================================== */

randomBtn.onclick = function() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i=0;i<6;i++) {

    code +=
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ];

  }

  roomInput.value =
    code;
};


/* =====================================================
   MICROPHONE
===================================================== */

async function getMic() {

  if(localStream) {
    return localStream;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "Microphone API is unavailable."
    );

  }

  log("Requesting microphone...");

  localStream =
    await navigator.mediaDevices.getUserMedia({

      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },

      video:false

    });

  localStream
    .getAudioTracks()
    .forEach(track => {

      track.enabled =
        false;

    });

  log("🎙️ Microphone ready.");

  return localStream;
}


/* =====================================================
   CREATE PEER
===================================================== */

async function createPeer() {

  peer =
    new RTCPeerConnection(
      rtcConfig
    );


  remoteStream =
    new MediaStream();


  peer.ontrack =
    event => {

      event.streams[0]
        .getTracks()
        .forEach(track => {

          remoteStream.addTrack(
            track
          );

        });


      remoteAudio.srcObject =
        remoteStream;


      remoteAudio.volume =
        Number(volume.value);


      remoteAudio.play()
        .catch(() => {

          log(
            "Tap the screen once to enable audio."
          );

        });


      log(
        "🔊 Remote audio connected."
      );

    };


  peer.onicecandidate =
    event => {

      if(!event.candidate) {
        return;
      }


      const path =
        isCaller
          ? "callerCandidates"
          : "calleeCandidates";


      roomRef
        .child(path)
        .push(
          event.candidate.toJSON()
        );

    };


  peer.onconnectionstatechange =
    () => {

      const state =
        peer.connectionState;


      log(
        "WebRTC: " + state
      );


      if(
        state === "connected"
      ) {

        setStatus(
          "Connected",
          "green"
        );

        talk.disabled =
          false;

        talkStatus.textContent =
          "Ready";

      }


      else if(
        state === "connecting"
      ) {

        setStatus(
          "Connecting...",
          "yellow"
        );

      }


      else if(
        state === "failed"
      ) {

        setStatus(
          "Connection failed",
          "red"
        );

        talk.disabled =
          true;

        talkStatus.textContent =
          "Connection failed";

      }


      else if(
        state === "disconnected"
      ) {

        setStatus(
          "Disconnected",
          "red"
        );

      }

    };


  localStream
    .getTracks()
    .forEach(track => {

      peer.addTrack(
        track,
        localStream
      );

    });

}


/* =====================================================
   CREATE ROOM
===================================================== */

async function createRoom() {

  isCaller =
    true;


  setStatus(
    "Creating room...",
    "yellow"
  );


  await createPeer();


  roomRef =
    database.ref(
      "walkieRooms/" +
      roomCode
    );


  /*
   * Create the room.
   */

  await roomRef.set({

    createdAt:
      firebase.database.ServerValue.TIMESTAMP,

    state:
      "waiting"

  });


  /*
   * Listen for answer.
   */

  roomRef
    .child("answer")
    .on(
      "value",
      async snapshot => {

        const answer =
          snapshot.val();


        if(
          !answer ||
          peer.currentRemoteDescription
        ) {

          return;

        }


        try {

          await peer.setRemoteDescription(
            new RTCSessionDescription(
              answer
            )
          );


          log(
            "Answer received."
          );

        } catch(error) {

          log(
            "Answer error: " +
            error.message
          );

        }

      }
    );


  /*
   * Receive callee ICE.
   */

  roomRef
    .child("calleeCandidates")
    .on(
      "child_added",
      async snapshot => {

        try {

          await peer.addIceCandidate(
            new RTCIceCandidate(
              snapshot.val()
            )
          );

        } catch(error) {

          log(
            "ICE error."
          );

        }

      }
    );


  /*
   * Create offer.
   */

  const offer =
    await peer.createOffer();


  await peer.setLocalDescription(
    offer
  );


  await roomRef
    .child("offer")
    .set({

      type:
        offer.type,

      sdp:
        offer.sdp

    });


  setStatus(
    "Waiting for another device...",
    "yellow"
  );


  talkStatus.textContent =
    "Waiting for another device...";


  log(
    "📡 Room created."
  );

}


/* =====================================================
   JOIN ROOM
===================================================== */

async function joinExistingRoom() {

  isCaller =
    false;


  setStatus(
    "Joining room...",
    "yellow"
  );


  await createPeer();


  const offerSnapshot =
    await roomRef
      .child("offer")
      .once("value");


  const offer =
    offerSnapshot.val();


  if(!offer) {

    throw new Error(
      "The room is not ready yet."
    );

  }


  await peer.setRemoteDescription(
    new RTCSessionDescription(
      offer
    )
  );


  /*
   * Receive caller ICE.
   */

  roomRef
    .child("callerCandidates")
    .on(
      "child_added",
      async snapshot => {

        try {

          await peer.addIceCandidate(
            new RTCIceCandidate(
              snapshot.val()
            )
          );

        } catch(error) {

          log(
            "ICE error."
          );

        }

      }
    );


  /*
   * Create answer.
   */

  const answer =
    await peer.createAnswer();


  await peer.setLocalDescription(
    answer
  );


  await roomRef
    .child("answer")
    .set({

      type:
        answer.type,

      sdp:
        answer.sdp

    });


  log(
    "📡 Answer sent."
  );

}


/* =====================================================
   JOIN
===================================================== */

joinBtn.onclick =
  async function() {

    const code =
      roomInput.value
        .trim()
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          ""
        );


    if(!code) {

      alert(
        "Enter a room code."
      );

      return;

    }


    roomCode =
      code;


    joinBtn.disabled =
      true;

    randomBtn.disabled =
      true;


    try {

      /*
       * IMPORTANT:
       *
       * This is triggered directly
       * by the user's button press.
       *
       * Safari allows the microphone
       * request here.
       */

      await getMic();


      roomDisplay.textContent =
        roomCode;


      join.classList.add(
        "hidden"
      );

      walkie.classList.remove(
        "hidden"
      );


      roomRef =
        database.ref(
          "walkieRooms/" +
          roomCode
        );


      const existing =
        await roomRef.once(
          "value"
        );


      if(existing.exists()) {

        await joinExistingRoom();

      } else {

        await createRoom();

      }

    } catch(error) {

      console.error(error);

      log(
        "ERROR: " +
        error.message
      );


      alert(
        "Could not join room:\n\n" +
        error.message
      );


      cleanup();


      joinBtn.disabled =
        false;

      randomBtn.disabled =
        false;

    }

  };


/* =====================================================
   HOLD TO TALK
===================================================== */

function startTalking(event) {

  event.preventDefault();


  if(
    !peer ||
    peer.connectionState !==
      "connected"
  ) {

    return;

  }


  if(
    isMuted ||
    isTalking
  ) {

    return;

  }


  isTalking =
    true;


  talk.classList.add(
    "active"
  );


  talkStatus.textContent =
    "🔴 TRANSMITTING";


  wave.classList.add(
    "active"
  );


  if(localStream) {

    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          true;

      });

  }

}


function stopTalking(event) {

  if(event) {
    event.preventDefault();
  }


  if(!isTalking) {
    return;
  }


  isTalking =
    false;


  talk.classList.remove(
    "active"
  );


  wave.classList.remove(
    "active"
  );


  talkStatus.textContent =
    "Ready";


  if(localStream) {

    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          false;

      });

  }

}


/* =====================================================
   POINTER EVENTS
===================================================== */

talk.addEventListener(
  "pointerdown",
  startTalking
);

talk.addEventListener(
  "pointerup",
  stopTalking
);

talk.addEventListener(
  "pointercancel",
  stopTalking
);

talk.addEventListener(
  "pointerleave",
  stopTalking
);


/* =====================================================
   MUTE
===================================================== */

mute.onclick =
  function() {

    isMuted =
      !isMuted;


    if(isMuted) {

      mute.textContent =
        "🔇 Mic Muted";

      mute.classList.add(
        "danger"
      );


      if(localStream) {

        localStream
          .getAudioTracks()
          .forEach(track => {

            track.enabled =
              false;

          });

      }


      isTalking =
        false;


      talk.classList.remove(
        "active"
      );

      wave.classList.remove(
        "active"
      );


      talkStatus.textContent =
        "Mic muted";

    }

    else {

      mute.textContent =
        "🎙️ Mic On";

      mute.classList.remove(
        "danger"
      );


      talkStatus.textContent =
        "Ready";

    }

  };


/* =====================================================
   VOLUME
===================================================== */

volume.oninput =
  function() {

    remoteAudio.volume =
      Number(
        volume.value
      );

  };


/* =====================================================
   LEAVE
===================================================== */

leave.onclick =
  function() {

    cleanup();

  };


/* =====================================================
   CLEANUP
===================================================== */

function cleanup() {

  isTalking =
    false;


  if(roomRef) {

    roomRef.off();

  }


  if(peer) {

    peer.close();

  }


  if(localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

  }


  peer =
    null;

  localStream =
    null;

  remoteStream =
    null;

  roomRef =
    null;


  remoteAudio.srcObject =
    null;


  roomCode =
    "";


  walkie.classList.add(
    "hidden"
  );

  join.classList.remove(
    "hidden"
  );


  joinBtn.disabled =
    false;

  randomBtn.disabled =
    false;

  talk.disabled =
    true;


  setStatus(
    "Not connected"
  );


  logBox.innerHTML =
    "";

}


/* =====================================================
   SAFETY
===================================================== */

window.addEventListener(
  "blur",
  stopTalking
);

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden) {
      stopTalking();
    }

  }
);


/* =====================================================
   START
===================================================== */

log(
  "📻 Web Walkie loaded."
);

</script>

</body>
</html>
